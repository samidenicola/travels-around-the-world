name: Keep Supabase Alive

on:
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase
        run: |
          curl -sf --retry 4 --retry-delay 30 --retry-all-errors --max-time 60 \
            "https://kojbftresjzbykgyslhl.supabase.co/rest/v1/current_location?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
      - name: Keep this scheduled workflow enabled
        uses: gautamkrishnar/keepalive-workflow@v2
